name: Release

# Push a tag like v0.1.0 to build the macOS and Windows downloads, test them, and publish a GitHub release.
# Release notes come from docs/releases/<tag>.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  private-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private notes or personal paths in tracked files
        run: python3 scripts/check_private_strings.py

  version:
    needs: private-strings
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Tag matches the app versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mac="$(python3 -c 'import plistlib; print(plistlib.load(open("VoiceFlow/Support/Info.plist","rb"))["CFBundleShortVersionString"])')"
          win="$(grep -oPm1 '(?<=<Version>)[^<]+' windows/Directory.Build.props)"
          echo "tag=$tag macOS=$mac Windows=$win"
          [ "$tag" = "$mac" ] && [ "$tag" = "$win" ] || { echo "Version mismatch"; exit 1; }
          test -f "docs/releases/v$tag.md" || { echo "Missing docs/releases/v$tag.md"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      requirement: ${{ steps.dmg.outputs.requirement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: swift test --package-path VoiceFlow
      # Without these secrets the build is ad hoc signed. See docs/RELEASING.md.
      - name: Import the signing identity into a temporary keychain
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: scripts/import-signing-cert.sh
      - name: Build the DMG (universal)
        id: dmg
        run: |
          scripts/release.sh
          echo "requirement=$(cat build/designated-requirement.txt)" >> "$GITHUB_OUTPUT"
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: build/VoiceFlow-${{ needs.version.outputs.version }}-macOS.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet test windows/VoiceFlow.Core.Tests -c Release
      - name: Publish x64 and arm64
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish windows/VoiceFlow.Windows -c Release -r "win-$arch" --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -o "out/win-$arch"
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $arch" }
            Copy-Item "out/win-$arch/VoiceFlow.exe" "dist/VoiceFlow-$v-Windows-$arch.exe"
          }
      - name: Self-test (x64)
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $p = Start-Process "dist/VoiceFlow-$v-Windows-x64.exe" -ArgumentList '--self-test','--self-test-out','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  windows-arm64-test:
    needs: [version, windows]
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - name: Self-test (arm64)
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $p = Start-Process "dist/VoiceFlow-$v-Windows-arm64.exe" -ArgumentList '--self-test','--self-test-out','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

  publish:
    needs: [version, macos, windows, windows-arm64-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance (verify with `gh attestation verify <file> -R ${{ github.repository }}`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_REQUIREMENT: ${{ needs.macos.outputs.requirement }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoiceFlow ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  homebrew-cask:
    # Uses the workflow's own token, so no personal access token has to be stored.
    needs: [version, publish]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Point the cask at the published DMG
        id: cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          current="$(sed -nE 's/^  version "([^"]+)"/\1/p' Casks/voiceflow.rb)"
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)"
          if [ "$newest" != "$VERSION" ] || [ "$current" = "$VERSION" ]; then
            echo "Cask is at $current; nothing to do for $VERSION."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "VoiceFlow-$VERSION-macOS.dmg" --dir "$RUNNER_TEMP"
          sha="$(sha256sum "$RUNNER_TEMP/VoiceFlow-$VERSION-macOS.dmg" | cut -d' ' -f1)"
          scripts/update-cask.sh "$VERSION" "$sha"
          ruby -c Casks/voiceflow.rb
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit the cask to main, or open a pull request if main is protected
        if: steps.cask.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/voiceflow.rb
          git commit -m "Update the Homebrew cask to $VERSION"
          if git push origin HEAD:main; then
            exit 0
          fi
          branch="cask/v$VERSION"
          if git push origin "HEAD:refs/heads/$branch" && \
             gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
               --title "Update the Homebrew cask to $VERSION" \
               --body "The release workflow could not push to main. Merge this so brew users get $VERSION."; then
            echo "::warning::main is protected: opened a pull request for the cask update."
          else
            echo "::warning::Could not update the cask automatically. Run scripts/update-cask.sh by hand."
            { echo '```ruby'; cat Casks/voiceflow.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  site:
    # A release made with the workflow token doesn't fire `release` events, so dispatch the deploy here.
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Deploy the landing page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
